name: Production readiness
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    concurrency:
      group: quality-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit
      - run: npm run lint
      - run: npm run test:lint
      - run: npm test
      - run: npm run build
      - run: npm run typecheck
  browsers:
    concurrency:
      group: browser-${{ matrix.browser }}-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    env:
      BROWSER_ENGINE: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npm run build
      - run: node tests/with-server.cjs tests/interactions.cjs tests/browser-audit.cjs
      - if: matrix.browser == 'webkit'
        run: node tests/with-server.cjs tests/apple-devices.cjs
      - if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: browser-${{ matrix.browser }}
          path: |
            tests/*.png
            tests/*.log
  native-safari:
    strategy:
      fail-fast: false
      matrix:
        target: [macos, ipad]
    concurrency:
      group: safari-macos15-${{ matrix.target }}-${{ github.ref }}
      cancel-in-progress: true
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: sudo safaridriver --enable
      - name: Native macOS Safari
        if: matrix.target == 'macos'
        run: node tests/with-server.cjs tests/safari.cjs
      - name: Boot an iPadOS Simulator
        id: ipad-setup
        if: ${{ matrix.target == 'ipad' && !cancelled() }}
        run: node tests/prepare-apple-simulator.cjs
      - name: Native iPadOS Safari
        if: ${{ matrix.target == 'ipad' && !cancelled() && steps.ipad-setup.outcome == 'success' }}
        timeout-minutes: 5
        env:
          SAFARI_TARGET: ipad
        run: node tests/with-server.cjs tests/safari.cjs
      - if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: native-safari-${{ matrix.target }}
          path: |
            tests/*.png
            tests/*.log
